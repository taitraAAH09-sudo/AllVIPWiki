<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>展覽處提詞機 V4</title>
<style>
  :root{
    --bg:#0d0d0f;
    --bg-elev:#17171a;
    --text:#f2f2f2;
    --muted:#8a8a92;
    --accent:#5b8cff;
    --accent-dim:#3a4f8f;
    --border:#2a2a2e;
    --danger:#ff5b5b;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    overflow:hidden;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
  }

  /* ---------- EDIT VIEW ---------- */
  #editView{
    display:flex;
    flex-direction:column;
    height:100%;
    padding:20px;
    gap:12px;
  }
  #editView h1{
    margin:0;
    font-size:20px;
    font-weight:600;
    color:var(--text);
  }
  .headRow{
    display:flex;
    align-items:center;
    gap:14px;
    flex-shrink:0;
  }
  .brand{
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    color:var(--text);
  }
  /* LOGO 含黑色文字，深色背景下看不清楚，所以墊一塊白底 */
  .logoBadge{
    background:#fff;
    border-radius:10px;
    padding:5px 10px;
    display:flex;
  }
  .logoBadge img{height:56px;width:auto;display:block;}
  .ver{
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    border:1px solid var(--border);
    border-radius:8px;
    padding:3px 10px;
    letter-spacing:.5px;
    align-self:flex-start;
  }
  #editView .sub{
    color:var(--muted);
    font-size:13px;
    margin-top:-6px;
  }

  /* ---- 格式工具列 ---- */
  #toolbar{
    display:flex;
    align-items:center;
    gap:2px;
    padding:6px 8px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    overflow-x:auto;
    flex-shrink:0;
  }
  .tb{
    position:relative;
    width:38px;height:36px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    border-radius:8px;
    color:var(--muted);
    padding:0;
  }
  .tb svg{
    width:20px;height:20px;
    stroke:currentColor;
    fill:none;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .tb:hover{color:var(--text);background:#232327;}
  .tb.on{color:var(--text);background:#2c2c32;}
  .tb .bar{
    position:absolute;
    left:10px;right:10px;bottom:3px;
    height:3px;
    border-radius:2px;
    background:#f2f2f2;
  }
  .sep{
    width:1px;height:22px;
    background:var(--border);
    margin:0 6px;
    flex-shrink:0;
  }

  /* ---- 編輯區（可編輯的富文字） ---- */
  #scriptInput{
    flex:1;
    position:relative;
    width:100%;
    overflow-y:auto;
    background:var(--bg-elev);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    font-size:17px;
    line-height:1.6;
    outline:none;
    text-align:center;
    white-space:pre-wrap;
    word-break:break-word;
  }
  #scriptInput:focus{border-color:var(--accent);}
  #scriptInput.empty::before{
    content:attr(data-placeholder);
    position:absolute;
    top:16px;left:16px;right:16px;
    color:var(--muted);
    text-align:left;
    white-space:pre-wrap;
    pointer-events:none;
  }
  #scriptInput div, #scriptInput p{margin:0;}
  #scriptInput ul, #scriptInput ol{margin:0;padding:0 0 0 1.4em;text-align:left;}
  #scriptInput .marker-line{
    color:var(--accent);
    border-left:3px solid var(--accent);
    padding-left:8px;
  }

  #colorPop{
    position:fixed;
    display:none;
    z-index:50;
    width:200px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  #colorPop.show{display:block;}
  #colorPop .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .sw{
    width:28px;height:28px;
    border-radius:50%;
    border:2px solid #3a3a40;
    cursor:pointer;
    padding:0;
    position:relative;
    overflow:hidden;
  }
  .sw:hover{border-color:#fff;}
  .sw.none{background:transparent;}
  .sw.none::after{
    content:'';
    position:absolute;
    left:-4px;right:-4px;top:50%;
    height:2px;
    background:var(--danger);
    transform:rotate(-45deg);
  }
  #colorPop .custom{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:12px;
    font-size:12px;color:var(--muted);
  }
  #colorPop input[type=color]{
    width:46px;height:26px;padding:0;
    border:1px solid var(--border);
    background:none;
    border-radius:6px;
    cursor:pointer;
  }

  .hint{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
  }
  .hint code{
    background:var(--bg-elev);
    border:1px solid var(--border);
    padding:1px 6px;
    border-radius:6px;
    color:var(--accent);
  }
  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .spacer{flex:1;}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .btn{
    background:var(--bg-elev);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 16px;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    font-weight:600;
  }
  .btn.primary:hover{background:#4a7bef;}

  /* ---------- PROMPTER VIEW ---------- */
  #prompterView{
    display:none;
    height:100%;
    flex-direction:column;
    position:relative;
  }
  #topBar{
    display:flex;
    align-items:center;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    gap:12px;
    font-size:13px;
    color:var(--muted);
    flex-shrink:0;
  }
  #topBar .backLink{
    display:flex;
    align-items:center;
    gap:4px;
    color:var(--muted);
    cursor:pointer;
    user-select:none;
  }
  #topBar .backLink:hover{color:var(--text);}
  #topBar .line{
    flex:1;
    height:1px;
    background:var(--border);
  }
  #fullscreenBtn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:16px;
  }
  #fullscreenBtn:hover{color:var(--text);}

  #stage{
    flex:1;
    position:relative;
    overflow:hidden;
  }
  /* 閱讀箭頭：大小由 --as（px）控制 */
  #centerArrow{
    --as:72;
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:calc(var(--as) * 0.9px);
    height:calc(var(--as) * 1px + 12px);
    z-index:5;
    cursor:grab;
    touch-action:none;
    display:flex;
    align-items:center;
    justify-content:flex-start;
  }
  #centerArrow:active{cursor:grabbing;}
  #centerArrow::after{
    content:'';
    width:0;
    height:0;
    border-top:calc(var(--as) * 0.5px) solid transparent;
    border-bottom:calc(var(--as) * 0.5px) solid transparent;
    border-left:calc(var(--as) * 0.8px) solid rgba(255,255,255,0.9);
    filter:drop-shadow(0 0 6px rgba(0,0,0,0.5));
  }
  #centerArrow.dragging::after{
    border-left-color:var(--accent);
    filter:drop-shadow(0 0 10px rgba(91,140,255,0.9));
  }
  #scrollWrap{
    position:absolute;
    top:0;left:0;right:0;
    padding:50vh 8% 50vh 8%;
    will-change:transform;
  }
  #scriptText{
    --fw:700;
    font-size:44px;
    line-height:1.65;
    font-weight:var(--fw);
    text-align:center;
    color:var(--text);
    white-space:pre-wrap;
    word-break:break-word;
  }
  #scriptText div, #scriptText p{margin:0;}
  #scriptText b, #scriptText strong{font-weight:calc(var(--fw) + 250);}
  #scriptText ul, #scriptText ol{margin:0;padding:0;list-style-position:inside;}
  #scriptText blockquote{margin:0 0 0 2em;padding:0;border:0;}

  /* ---------- SHUTTLE (jog) BAR ---------- */
  #shuttleBar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 16px;
    border-top:1px solid var(--border);
    user-select:none;
    -webkit-user-select:none;
  }
  #shuttleBar .chev{color:var(--muted);font-size:18px;line-height:1;width:20px;text-align:center;}
  #shuttleTrack{
    position:relative;
    flex:1;
    height:34px;
    touch-action:none;
    cursor:ew-resize;
  }
  #shuttleTrack::before{
    content:'';
    position:absolute;
    left:0;right:0;top:50%;
    height:2px;
    margin-top:-1px;
    background:var(--border);
    border-radius:1px;
  }
  #shuttleTrack::after{
    content:'';
    position:absolute;
    left:50%;top:6px;bottom:6px;
    width:2px;
    margin-left:-1px;
    background:#3a3a40;
  }
  #shuttleThumb{
    position:absolute;
    left:50%;
    top:50%;
    width:46px;height:24px;
    transform:translate(-50%,-50%);
    border-radius:12px;
    background:#5a6478;
    border:1px solid #7c869b;
    z-index:2;
    transition:left .18s ease-out, background .15s;
    display:flex;align-items:center;justify-content:center;gap:3px;
  }
  #shuttleThumb i{display:block;width:2px;height:10px;background:#dfe4ee;border-radius:1px;}
  #shuttleTrack.dragging #shuttleThumb{transition:none;background:var(--accent);border-color:#9db9ff;}
  #shuttleRead{
    width:64px;
    text-align:right;
    font-variant-numeric:tabular-nums;
    font-size:14px;
    color:var(--muted);
  }
  #shuttleRead.rev{color:var(--danger);}
  #shuttleRead.fast{color:var(--accent);}

  #controls{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
    position:relative;
  }
  .ctrl{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:10px;
  }
  .ctrl svg{width:22px;height:22px;stroke:var(--muted);fill:none;}
  .ctrl:hover{color:var(--text);}
  .ctrl:hover svg{stroke:var(--text);}
  .ctrl.active{color:var(--accent);}
  .ctrl.active svg{stroke:var(--accent);}
  #timer{
    position:absolute;
    right:16px;
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    font-variant-numeric:tabular-nums;
    font-size:20px;
    color:var(--muted);
  }

  #settingsPanel, #textPanel{
    position:absolute;
    bottom:70px;
    right:16px;
    background:var(--bg-elev);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    display:none;
    flex-direction:column;
    gap:14px;
    width:250px;
    max-height:calc(100vh - 180px);
    overflow-y:auto;
    z-index:20;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  #settingsPanel.show, #textPanel.show{display:flex;}
  #settingsPanel label, #textPanel label{
    display:flex;
    flex-direction:column;
    gap:6px;
    font-size:12px;
    color:var(--muted);
  }
  #settingsPanel input[type=range], #textPanel input[type=range]{
    accent-color:var(--accent);
  }
  #settingsPanel .toggleRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    color:var(--text);
  }
  #textPanel .selRow{
    display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--muted);
  }
  #textPanel select{
    flex:1;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
  }
  .switch{
    width:38px;height:22px;
    background:var(--border);
    border-radius:11px;
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch.on{background:var(--accent);}
  .switch::after{
    content:'';
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:#fff;
    transition:left .15s;
  }
  .switch.on::after{left:18px;}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#0d0d0f;--bg-elev:#17171a;--text:#f2f2f2;--muted:#8a8a92;--border:#2a2a2e;
    }
  }
</style>
</head>

    <div class="hint">選取文字後可套用粗體、顏色、螢光標記、對齊。<b>標記段落：反白選取一段文字 → 按一下書籤鈕</b>，這段就成為一個段落標記（再按一次取消）。沒有反白時，會標記游標所在的段落（以空白行分隔）。也可手動在段落開頭輸入 <code>::</code>。貼上內容會自動轉成純文字。</div>

  <!-- PROMPTER VIEW -->
  <div id="prompterView">
    <div id="topBar">

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const editView = $('editView');
  const prompterView = $('prompterView');
  const editor = $('scriptInput');
  const toolbar = $('toolbar');
  const colorPop = $('colorPop');
  const foreBar = $('foreBar');
  const backBar = $('backBar');
  const startBtn = $('startBtn');
  const backBtn = $('backBtn');
  const scriptText = $('scriptText');
  const scrollWrap = $('scrollWrap');
  const stage = $('stage');
  const playBtn = $('playBtn');
  const playIcon = $('playIcon');
  const prevMarkBtn = $('prevMarkBtn');
  const nextMarkBtn = $('nextMarkBtn');
  const speedToggleBtn = $('speedToggleBtn');
  const sizeToggleBtn = $('sizeToggleBtn');
  const settingsBtn = $('settingsBtn');
  const settingsPanel = $('settingsPanel');
  const textPanel = $('textPanel');
  const speedSlider = $('speedSlider');
  const speedVal = $('speedVal');
  const sizeSlider = $('sizeSlider');
  const sizeVal = $('sizeVal');
  const lhSlider = $('lhSlider');
  const lhVal = $('lhVal');
  const marginSlider = $('marginSlider');
  const marginVal = $('marginVal');
  const fwSlider = $('fwSlider');
  const fwVal = $('fwVal');
  const arrowSlider = $('arrowSlider');
  const arrowVal = $('arrowVal');
  const fontSelect = $('fontSelect');
  const mirrorSwitch = $('mirrorSwitch');
  const timerEl = $('timer');
  const fullscreenBtn = $('fullscreenBtn');
  const centerArrow = $('centerArrow');
  const shuttleTrack = $('shuttleTrack');
  const shuttleThumb = $('shuttleThumb');
  const shuttleRead = $('shuttleRead');

  const BASE_PX_PER_SEC = 40;   // 1.0x 的基準速度
  const SHUTTLE_ACCEL = 20;     // 拖到最右：在「目前速度」之上再加 20 倍（共 21 倍）
  const SHUTTLE_REV = 10;       // 拖到最左：以「目前速度」的 10 倍倒退
  const SPEED_MIN = 0.1, SPEED_MAX = 4;
  const SCRIPT_KEY = 'teleprompter_script_html';

  const FONTS = {
    sans : '-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif',
    serif: '"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif',
    kai  : '"Kaiti TC","DFKai-SB","BiauKai","KaiTi",serif',
    arial: 'Arial,"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif',
    times: '"Times New Roman",Times,"Songti TC","PMingLiU",serif'
  };

  const TEXT_COLORS = [
    ['預設','#f2f2f2'],['黃','#ffd54a'],['橘','#ffa94d'],['紅','#ff6b6b'],['粉','#ff8fd1'],
    ['綠','#6be675'],['青','#5ad1ff'],['藍','#7ea3ff'],['紫','#c39bff'],['灰','#9a9aa2']
  ];
  const HILITE_COLORS = [
    ['無','transparent'],['黃','#a68300'],['橘','#b8620f'],['紅','#b3312f'],['綠','#24803f'],
    ['藍','#2b5fc7'],['紫','#7a45c2'],['灰','#4a4a52']
  ];

  /* =====================================================
     編輯器（富文字）
     ===================================================== */
  const BLOCK_TAGS = new Set(['DIV','P','UL','OL','BLOCKQUOTE','H1','H2','H3','H4','H5','H6','PRE']);
  let savedRange = null;
  let saveTimer = null;

  function esc(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function refreshEditor(){
    flattenEditor();
    if(!editor.firstChild || (editor.childNodes.length === 1 && editor.firstChild.nodeName === 'BR')){
      editor.innerHTML = '<div><br></div>';
      placeCaret(editor.firstChild, 0);
    }
    Array.prototype.forEach.call(editor.children, (ch) => {
      ch.classList.toggle('marker-line', /^\s*::/.test(ch.textContent));
      if(!ch.getAttribute('class')) ch.removeAttribute('class');
    });
    editor.classList.toggle('empty', editor.textContent.trim() === '' && editor.children.length <= 1);
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveScript, 400);
  }
  function saveScript(){
    try{ localStorage.setItem(SCRIPT_KEY, editor.innerHTML); }catch(e){}
  }

  function placeCaret(node, offset){
    try{
      const sel = window.getSelection();
      const r = document.createRange();
      r.setStart(node, offset);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    }catch(e){}
  }

  function ensureEditorSelection(){
    const sel = window.getSelection();
    if(sel.rangeCount && editor.contains(sel.anchorNode)) return;
    editor.focus();
    sel.removeAllRanges();
    try{
      if(savedRange){
        sel.addRange(savedRange);
      } else {
        const r = document.createRange();
        r.selectNodeContents(editor);
        r.collapse(false);
        sel.addRange(r);
      }
    }catch(e){
      const r = document.createRange();
      r.selectNodeContents(editor);
      r.collapse(false);
      sel.addRange(r);
    }
  }

  function updateToolbarState(){
    const sel = window.getSelection();
    if(!sel.rangeCount || !editor.contains(sel.anchorNode)) return;
    toolbar.querySelectorAll('[data-cmd]').forEach((b) => {
      let on = false;
      try{ on = document.queryCommandState(b.dataset.cmd); }catch(e){}
      b.classList.toggle('on', !!on);
    });
  }

  document.addEventListener('selectionchange', () => {
    const sel = window.getSelection();
    if(sel.rangeCount && editor.contains(sel.anchorNode)){
      savedRange = sel.getRangeAt(0).cloneRange();
      updateToolbarState();
    }
  });

  function exec(cmd, val){
    ensureEditorSelection();
    const useCss = ['foreColor','hiliteColor','justifyLeft','justifyCenter','justifyRight'].indexOf(cmd) >= 0;
    try{ document.execCommand('styleWithCSS', false, useCss); }catch(e){}
    document.execCommand(cmd, false, val === undefined ? null : val);
    refreshEditor();
    scheduleSave();
    updateToolbarState();
  }

  function currentBlock(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return null;
    let n = sel.anchorNode;
    if(!n || !editor.contains(n)) return null;
    if(n === editor){
      n = editor.childNodes[sel.anchorOffset] || editor.lastChild;
      if(!n) return null;
    }
    while(n.parentNode !== editor) n = n.parentNode;
    if(n.nodeType === 3 || !BLOCK_TAGS.has(n.nodeName)){
      const d = document.createElement('div');
      editor.insertBefore(d, n);
      d.appendChild(n);
      return d;
    }
    return n;
  }

  /* ---- 標記輔助函式 ---- */
  function isEmptyBlock(el){ return el.textContent.replace(/[\s\u00A0]/g, '') === ''; }
  function hasMark(el){ return /^\s*::/.test(el.textContent); }
  function firstTextNode(el){
    return document.createTreeWalker(el, NodeFilter.SHOW_TEXT).nextNode();
  }
  function isBlockNode(n){ return n.nodeType === 1 && BLOCK_TAGS.has(n.nodeName) ; }

  /* 整理編輯區結構：確保「每一行 = 編輯區根層級的一個區塊」。
     貼上文字時，瀏覽器有時會把所有行包在同一個 <div> 裡（巢狀），
     這會讓標記把整份稿件當成一個區塊。這裡把巢狀的 div/p 拆平，
     並把零散的文字包成 div。 */
  const NEST_TAGS = new Set(['DIV','P']);
  function hasBlockChild(el){
    for(let i = 0; i < el.children.length; i++){
      if(NEST_TAGS.has(el.children[i].nodeName)) return true;
    }
    return false;
  }
  function flattenNode(node, inheritedStyle){
    if(node.nodeType === 1 && NEST_TAGS.has(node.nodeName) && hasBlockChild(node)){
      const style = node.getAttribute('style') || inheritedStyle;
      const out = [];
      let run = null;
      Array.prototype.slice.call(node.childNodes).forEach((c) => {
        if(c.nodeType === 1 && NEST_TAGS.has(c.nodeName)){
          run = null;
          flattenNode(c, style).forEach((x) => out.push(x));
        } else if(c.nodeType === 3 && !c.data.trim() && !run){
          // 區塊之間的純空白，忽略
        } else if(c.nodeName === 'BR' && !run){
          // 區塊之間多餘的換行，忽略
        } else {
          if(!run){
            run = document.createElement('div');
            if(style) run.setAttribute('style', style);
            out.push(run);
          }
          run.appendChild(c);
        }
      });
      return out;
    }
    return [node];
  }
  function flattenEditor(){
    let needs = false;
    Array.prototype.forEach.call(editor.childNodes, (n) => {
      if(!isBlockNode(n) || (NEST_TAGS.has(n.nodeName) && hasBlockChild(n))) needs = true;
    });
    if(!needs) return;

    const sel = window.getSelection();
    const keep = sel.rangeCount ? {
      an: sel.anchorNode, ao: sel.anchorOffset, fn: sel.focusNode, fo: sel.focusOffset
    } : null;

    const out = [];
    let run = null;
    Array.prototype.slice.call(editor.childNodes).forEach((n) => {
      if(isBlockNode(n)){
        run = null;
        flattenNode(n, '').forEach((x) => out.push(x));
      } else if(n.nodeType === 3 && !n.data.trim() && !run){
        // 根層級純空白，忽略
      } else {
        if(!run){ run = document.createElement('div'); out.push(run); }
        run.appendChild(n);
      }
    });
    while(editor.firstChild) editor.removeChild(editor.firstChild);
    out.forEach((x) => editor.appendChild(x));

    if(keep && keep.an && editor.contains(keep.an) && keep.fn && editor.contains(keep.fn)){
      try{ sel.setBaseAndExtent(keep.an, keep.ao, keep.fn, keep.fo); }catch(e){}
    }
  }

  function setMark(el, on){
    let tn = firstTextNode(el);
    if(on){
      if(hasMark(el)) return;
      if(!tn){
        const br = el.querySelector('br');
        if(br) br.remove();
        tn = document.createTextNode('');
        el.insertBefore(tn, el.firstChild);
      }
      tn.insertData(0, '::');
    } else {
      if(!hasMark(el) || !tn) return;
      const m = /^\s*::\s?/.exec(tn.data);
      if(m) tn.deleteData(0, m[0].length);
      if(el.textContent === '' && !el.querySelector('br')) el.appendChild(document.createElement('br'));
    }
  }

  function selectedParagraphStarts(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return [];
    const r = sel.getRangeAt(0);
    const rootOf = (node) => {
      while(node && node.parentNode !== editor) node = node.parentNode;
      return node;
    };
    let a, b;
    if(r.startContainer === editor) a = editor.childNodes[r.startOffset] || editor.lastChild;
    else a = rootOf(r.startContainer);
    if(r.endContainer === editor) b = editor.childNodes[Math.max(0, r.endOffset - 1)] || editor.lastChild;
    else b = rootOf(r.endContainer);
    if(!a || !b) return [];
    // 三連點選整行時，選取尾端會落在下一行開頭，不應把下一段也算進去
    if(!r.collapsed && r.endOffset === 0 && b !== a && b.previousElementSibling){
      if(r.endContainer === b || r.endContainer === firstTextNode(b)) b = b.previousElementSibling;
    }
    const kids = Array.prototype.slice.call(editor.children);
    let i0 = kids.indexOf(a), i1 = kids.indexOf(b);
    if(i0 < 0 || i1 < 0) return [];
    if(i0 > i1){ const t = i0; i0 = i1; i1 = t; }
    const starts = [];
    for(let i = i0; i <= i1; i++){
      if(isEmptyBlock(kids[i])) continue;
      let k = i;
      while(k > 0 && !isEmptyBlock(kids[k-1])) k--;
      if(starts.indexOf(kids[k]) < 0) starts.push(kids[k]);
    }
    if(!starts.length){
      // 游標在空白行：改用下一個有內容的段落
      for(let i = i0; i < kids.length; i++){
        if(!isEmptyBlock(kids[i])){ starts.push(kids[i]); break; }
      }
    }
    return starts;
  }

  // 目前反白選取範圍內、真的有被選到文字的區塊（依序）
  function selectedBlocks(){
    const sel = window.getSelection();
    if(!sel.rangeCount) return [];
    const r = sel.getRangeAt(0);
    if(r.collapsed) return [];
    const res = [];
    Array.prototype.forEach.call(editor.children, (ch) => {
      if(!r.intersectsNode(ch)) return;
      const br = document.createRange();
      br.selectNodeContents(ch);
      const part = r.cloneRange();
      if(part.compareBoundaryPoints(Range.START_TO_START, br) < 0) part.setStart(br.startContainer, br.startOffset);
      if(part.compareBoundaryPoints(Range.END_TO_END, br) > 0) part.setEnd(br.endContainer, br.endOffset);
      if(part.toString().replace(/[\s\u00A0]/g, '') !== '') res.push(ch);
    });
    return res;
  }

  /* 反白選取的範圍 = 一個段落 = 一個標記（標在選取範圍的第一行）。
     再按一次書籤鈕可取消。沒有反白時，改標記游標所在的段落（以空白行分隔）。 */
  function toggleMarker(){
    ensureEditorSelection();
    flattenEditor();
    const blocks = selectedBlocks();
    if(blocks.length){
      const first = blocks[0];
      if(hasMark(first)){
        blocks.forEach((b) => setMark(b, false));
      } else {
        setMark(first, true);
        blocks.slice(1).forEach((b) => setMark(b, false));   // 一個選取範圍只留一個標記
      }
    } else {
      const starts = selectedParagraphStarts();
      if(!starts.length) return;
      const allMarked = starts.every(hasMark);
      starts.forEach((el) => setMark(el, !allMarked));
    }
    refreshEditor();
    scheduleSave();
  }

  function clearFormat(){
    ensureEditorSelection();
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    document.execCommand('removeFormat', false, null);
    const sel = window.getSelection();
    Array.prototype.forEach.call(editor.children, (ch) => {
      let hit = false;
      try{ hit = sel.containsNode(ch, true); }catch(e){}
      if(hit && ch.style && ch.style.textAlign){
        ch.style.textAlign = '';
        if(!ch.getAttribute('style')) ch.removeAttribute('style');
      }
    });
    refreshEditor();
    scheduleSave();
  }

  /* ---- 顏色浮動選單 ---- */
  let popKind = null;
  function openColorPop(kind, btn){
    if(colorPop.classList.contains('show') && popKind === kind){ closeColorPop(); return; }
    popKind = kind;
    colorPop.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'grid';
    (kind === 'fore' ? TEXT_COLORS : HILITE_COLORS).forEach(([name, c]) => {
      const b = document.createElement('button');
      b.className = 'sw' + (c === 'transparent' ? ' none' : '');
      b.title = name;
      if(c !== 'transparent') b.style.background = c;
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => applyColor(kind, c));
      grid.appendChild(b);
    });
    colorPop.appendChild(grid);
    const custom = document.createElement('label');
    custom.className = 'custom';
    custom.innerHTML = '自訂顏色 ';
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = kind === 'fore' ? '#ffd54a' : '#a68300';
    inp.addEventListener('change', () => applyColor(kind, inp.value));
    custom.appendChild(inp);
    colorPop.appendChild(custom);

    const r = btn.getBoundingClientRect();
    colorPop.style.top = (r.bottom + 6) + 'px';
    colorPop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 212)) + 'px';
    colorPop.classList.add('show');
  }
  function closeColorPop(){
    colorPop.classList.remove('show');
    popKind = null;
  }
  function applyColor(kind, c){
    ensureEditorSelection();
    if(kind === 'fore'){
      exec('foreColor', c);
      foreBar.style.background = c;
    } else {
      exec('hiliteColor', c);
      backBar.style.background = (c === 'transparent') ? '#4a4a52' : c;
    }
    closeColorPop();
  }
  document.addEventListener('mousedown', (e) => {
    if(!colorPop.classList.contains('show')) return;
    if(colorPop.contains(e.target)) return;
    if(e.target.closest && (e.target.closest('#foreBtn') || e.target.closest('#backBtnColor'))) return;
    closeColorPop();
  });

  /* ---- 工具列事件 ---- */
  toolbar.addEventListener('mousedown', (e) => {
    if(e.target.closest('.tb')) e.preventDefault();  // 保持編輯區選取範圍
  });
  toolbar.addEventListener('click', (e) => {
    const btn = e.target.closest('.tb');
    if(!btn) return;
    if(btn.dataset.cmd){ closeColorPop(); exec(btn.dataset.cmd); return; }
    switch(btn.dataset.act){
      case 'undo':   closeColorPop(); exec('undo'); break;
      case 'redo':   closeColorPop(); exec('redo'); break;
      case 'indent': closeColorPop(); exec('indent'); break;
      case 'outdent':closeColorPop(); exec('outdent'); break;
      case 'clear':  closeColorPop(); clearFormat(); break;
      case 'marker': closeColorPop(); toggleMarker(); break;
      case 'fore':   openColorPop('fore', btn); break;
      case 'back':   openColorPop('back', btn); break;
    }
  });

  editor.addEventListener('input', () => { refreshEditor(); scheduleSave(); updateToolbarState(); });
  editor.addEventListener('focus', () => {
    try{ document.execCommand('defaultParagraphSeparator', false, 'div'); }catch(e){}
  });
  editor.addEventListener('paste', (e) => {
    e.preventDefault();
    const cd = e.clipboardData || window.clipboardData;
    const t = (cd ? cd.getData('text/plain') : '').replace(/\r\n?/g, '\n');
    if(!t) return;
    if(t.indexOf('\n') < 0){
      document.execCommand('insertText', false, t);
    } else {
      const html = t.split('\n').map((l) => '<div>' + (l ? esc(l) : '<br>') + '</div>').join('');
      document.execCommand('insertHTML', false, html);
    }
    refreshEditor();
    scheduleSave();
  });
  editor.addEventListener('drop', (e) => {
    e.preventDefault();
    const t = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
    if(t){
      editor.focus();
      document.execCommand('insertText', false, t);
      refreshEditor();
      scheduleSave();
    }
  });

  /* =====================================================
     提詞機
     ===================================================== */
  let playing = false;
  let posY = 0;
  let pending = 0;          // 尚未完成的平滑位移（px）
  let speed = 1.0;          // 基礎播放速度
  let shuttle = 0;          // 拖曳滑桿的額外倍率（相對於目前速度；負到 -1 以下 = 倒退）
  let fontSize = 44;
  let lineHeight = 165;     // %
  let sideMargin = 8;       // %
  let fontWeight = 700;
  let arrowSize = 72;       // px
  let fontKey = 'sans';
  let mirrored = false;
  let rafId = null;
  let lastTs = null;
  let elapsedSec = 0;
  let timerInterval = null;

  function saveSettings(){
    try{
      localStorage.setItem('teleprompter_settings', JSON.stringify({
        speed, fontSize, lineHeight, sideMargin, fontWeight, arrowSize, fontKey, mirrored
      }));
    }catch(e){}
  }
  function loadSettings(){
    try{
      const o = JSON.parse(localStorage.getItem('teleprompter_settings') || 'null');
      if(o){
        if(typeof o.speed === 'number') speed = o.speed;
        if(typeof o.fontSize === 'number') fontSize = o.fontSize;
        if(typeof o.lineHeight === 'number') lineHeight = o.lineHeight;
        if(typeof o.sideMargin === 'number') sideMargin = o.sideMargin;
        if(typeof o.fontWeight === 'number') fontWeight = o.fontWeight;
        if(typeof o.arrowSize === 'number') arrowSize = o.arrowSize;
        if(typeof o.fontKey === 'string' && FONTS[o.fontKey]) fontKey = o.fontKey;
        if(typeof o.mirrored === 'boolean') mirrored = o.mirrored;
      }
    }catch(e){}
  }

  /* ---------- 把編輯器內容轉成提詞內容 ---------- */
  function stripMarkerPrefix(el){
    const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    const tn = tw.nextNode();
    if(tn) tn.data = tn.data.replace(/^\s*::\s*/, '');
  }
  function buildScript(){
    flattenEditor();
    scriptText.innerHTML = '';
    const out = [];
    let cur = null;
    Array.prototype.forEach.call(editor.childNodes, (node) => {
      if(node.nodeType === 1 && BLOCK_TAGS.has(node.nodeName)){
        cur = null;
        out.push(node.cloneNode(true));
      } else if(node.nodeName === 'BR'){
        if(cur){ cur = null; }
        else { const d = document.createElement('div'); d.appendChild(document.createElement('br')); out.push(d); }
      } else if(node.nodeType === 3 || node.nodeType === 1){
        if(!cur){ cur = document.createElement('div'); out.push(cur); }
        cur.appendChild(node.cloneNode(true));
      }
    });
    out.forEach((el) => {
      el.classList.remove('marker-line');
      const isMarker = /^\s*::/.test(el.textContent);
      if(isMarker){
        stripMarkerPrefix(el);
      }
      el.dataset.marker = isMarker ? '1' : '0';
      if(el.textContent === '' && !el.querySelector('br')) el.appendChild(document.createElement('br'));
      scriptText.appendChild(el);
    });
  }

  function markerTargets(){
    const arrowY = stage.clientHeight * arrowTopPct / 100;
    const res = [];
    Array.prototype.forEach.call(scriptText.children, (ch) => {
      if(ch.dataset.marker === '1') res.push(ch.offsetTop - arrowY);
    });
    return res;
  }

  function applyTransform(){
    scrollWrap.style.transform = (mirrored ? 'scaleX(-1) ' : '') + 'translateY(' + (-posY) + 'px)';
  }
  function maxScroll(){ return Math.max(0, scrollWrap.scrollHeight - stage.clientHeight); }
  function clampPos(){
    const max = maxScroll();
    if(posY < 0) posY = 0;
    if(posY > max) posY = max;
  }

  /* ---------- 捲動主迴圈（播放 / 拖曳滑桿 / 平滑位移時運作） ---------- */
  function effectiveSpeed(){ return playing ? speed * (1 + shuttle) : 0; }

  function updateReadout(){
    if(!playing){
      shuttleRead.textContent = '暫停';
      shuttleRead.classList.remove('rev');
      shuttleRead.classList.toggle('fast', playing && shuttle > 0);
      return;
    }
    const eff = effectiveSpeed();
    shuttleRead.textContent = eff.toFixed(1) + 'x';
    shuttleRead.classList.toggle('rev', eff < 0);
    shuttleRead.classList.toggle('fast', shuttle > 0);
  }

  function loop(ts){
    if(lastTs === null) lastTs = ts;
    const dt = Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    const eff = effectiveSpeed();
    let d = 0;
    if(eff !== 0) d += BASE_PX_PER_SEC * eff * dt;
    if(pending !== 0){
      const step = pending * (1 - Math.exp(-dt * 12));
      pending -= step;
      d += step;
      if(Math.abs(pending) < 0.3){ d += pending; pending = 0; }
    }
    if(d !== 0){
      posY += d;
      const before = posY;
      clampPos();
      if(posY !== before) pending = 0;
      applyTransform();
    }
    if(playing && eff >= 0 && posY >= maxScroll()){
      pause();
    }
    if(playing || pending !== 0){
      rafId = requestAnimationFrame(loop);
    } else {
      rafId = null;
    }
  }
  function ensureLoop(){
    if(rafId === null){
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    }
  }

  // 平滑捲動：在目前位置（含尚未完成的位移）上再加 px
  function smoothBy(px){
    const target = Math.max(0, Math.min(maxScroll(), posY + pending + px));
    pending = target - posY;
    ensureLoop();
  }
  function smoothTo(target){
    target = Math.max(0, Math.min(maxScroll(), target));
    pending = target - posY;
    ensureLoop();
  }

  function play(){
    if(playing) return;
    playing = true;
    playIcon.innerHTML = '<rect x="5" y="4" width="5" height="16"></rect><rect x="14" y="4" width="5" height="16"></rect>';
    ensureLoop();
    if(!timerInterval){
      timerInterval = setInterval(() => {
        if(playing){ elapsedSec++; updateTimerDisplay(); }
      }, 1000);
    }
    updateReadout();
  }
  function pause(){
    playing = false;
    playIcon.innerHTML = '<polygon points="6,4 20,12 6,20"></polygon>';
    updateReadout();
  }
  function togglePlay(){ if(playing) pause(); else play(); }

  function updateTimerDisplay(){
    const m = String(Math.floor(elapsedSec/60)).padStart(2,'0');
    const s = String(elapsedSec%60).padStart(2,'0');
    timerEl.textContent = m + ':' + s;
  }

  function resetAll(){
    pause();
    posY = 0;
    pending = 0;
    applyTransform();
    elapsedSec = 0;
    updateTimerDisplay();
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  }

  function jumpToNextMarker(){
    const ref = posY + pending;
    const t = markerTargets().find((y) => y > ref + 5);
    if(t !== undefined) smoothTo(t);
  }
  function jumpToPrevMarker(){
    const ref = posY + pending;
    const list = markerTargets().filter((y) => y < ref - 5);
    if(list.length) smoothTo(list[list.length - 1]);
  }

  /* ---------- 設定套用 ---------- */
  function setSpeed(v){
    v = Math.round(Math.max(SPEED_MIN, Math.min(SPEED_MAX, v)) * 10) / 10;
    speed = v;
    speedVal.textContent = v.toFixed(1) + 'x';
    speedSlider.value = v;
    updateReadout();
    saveSettings();
  }
  function afterLayoutChange(){ clampPos(); applyTransform(); }
  function setFontSize(v){
    fontSize = v;
    scriptText.style.fontSize = v + 'px';
    sizeVal.textContent = v + 'px';
    sizeSlider.value = v;
    afterLayoutChange();
    saveSettings();
  }
  function setLineHeight(v){
    lineHeight = v;
    scriptText.style.lineHeight = (v/100).toString();
    lhVal.textContent = v + '%';
    lhSlider.value = v;
    afterLayoutChange();
    saveSettings();
  }
  function setSideMargin(v){
    sideMargin = v;
    scrollWrap.style.paddingLeft = v + '%';
    scrollWrap.style.paddingRight = v + '%';
    marginVal.textContent = v + '%';
    marginSlider.value = v;
    afterLayoutChange();
    saveSettings();
  }
  function setFontWeight(v){
    fontWeight = v;
    scriptText.style.setProperty('--fw', v);
    fwVal.textContent = v;
    fwSlider.value = v;
    afterLayoutChange();
    saveSettings();
  }
  function setArrowSize(v){
    arrowSize = v;
    centerArrow.style.setProperty('--as', v);
    arrowVal.textContent = v + 'px';
    arrowSlider.value = v;
    saveSettings();
  }
  function setFont(key){
    fontKey = key;
    scriptText.style.fontFamily = FONTS[key];
    fontSelect.value = key;
    afterLayoutChange();
    saveSettings();
  }
  function toggleMirror(){
    mirrored = !mirrored;
    mirrorSwitch.classList.toggle('on', mirrored);
    applyTransform();
    saveSettings();
  }

  /* ---------- 面板開關 ---------- */
  function closePanels(){
    settingsPanel.classList.remove('show');
    textPanel.classList.remove('show');
  }
  function togglePanel(panel){
    const willShow = !panel.classList.contains('show');
    closePanels();
    if(willShow) panel.classList.add('show');
  }

  /* ---------- 畫面切換 ---------- */
  startBtn.addEventListener('click', () => {
    if(!editor.textContent.trim()){
      editor.innerHTML = '<div>::開場</div><div>在這裡輸入你的講稿...</div>';
      refreshEditor();
    }
    saveScript();
    buildScript();
    editView.style.display = 'none';
    prompterView.style.display = 'flex';
    resetAll();
  });
  backBtn.addEventListener('click', () => {
    pause();
    shuttle = 0;
    closePanels();
    prompterView.style.display = 'none';
    editView.style.display = 'flex';
  });

  /* ---------- 按鈕 ---------- */
  playBtn.addEventListener('click', togglePlay);
  prevMarkBtn.addEventListener('click', jumpToPrevMarker);
  nextMarkBtn.addEventListener('click', jumpToNextMarker);
  settingsBtn.addEventListener('click', () => togglePanel(settingsPanel));
  speedToggleBtn.addEventListener('click', () => togglePanel(settingsPanel));
  sizeToggleBtn.addEventListener('click', () => togglePanel(textPanel));

  speedSlider.addEventListener('input', (e) => setSpeed(parseFloat(e.target.value)));
  sizeSlider.addEventListener('input', (e) => setFontSize(parseInt(e.target.value,10)));
  lhSlider.addEventListener('input', (e) => setLineHeight(parseInt(e.target.value,10)));
  marginSlider.addEventListener('input', (e) => setSideMargin(parseInt(e.target.value,10)));
  fwSlider.addEventListener('input', (e) => setFontWeight(parseInt(e.target.value,10)));
  arrowSlider.addEventListener('input', (e) => setArrowSize(parseInt(e.target.value,10)));
  fontSelect.addEventListener('change', (e) => setFont(e.target.value));
  mirrorSwitch.addEventListener('click', toggleMirror);

  fullscreenBtn.addEventListener('click', () => {
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });

  document.addEventListener('click', (e) => {
    const t = e.target;
    const inside = (el) => el === t || el.contains(t);
    if(inside(settingsPanel) || inside(textPanel) ||
       inside(settingsBtn) || inside(speedToggleBtn) || inside(sizeToggleBtn)) return;
    closePanels();
  });

  /* ---------- 鍵盤：空白鍵 暫停/播放；← 減速；→ 加速；↑↓ 平滑捲動 ---------- */
  function isTyping(t){
    return t && (t.tagName === 'TEXTAREA' || t.isContentEditable ||
      (t.tagName === 'INPUT' && t.type !== 'range') || t.tagName === 'SELECT');
  }
  window.addEventListener('keydown', (e) => {
    if(prompterView.style.display !== 'flex') return;
    if(isTyping(e.target)) return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(!e.repeat) togglePlay();
    } else if(e.code === 'ArrowRight'){
      e.preventDefault();
      setSpeed(speed + (e.shiftKey ? 0.5 : 0.1));
    } else if(e.code === 'ArrowLeft'){
      e.preventDefault();
      setSpeed(speed - (e.shiftKey ? 0.5 : 0.1));
    } else if(e.code === 'ArrowUp'){
      e.preventDefault();
      smoothBy(-100);
    } else if(e.code === 'ArrowDown'){
      e.preventDefault();
      smoothBy(100);
    } else if(e.code === 'Escape'){
      backBtn.click();
    }
  }, true);
  window.addEventListener('keyup', (e) => {
    if(prompterView.style.display !== 'flex') return;
    if(e.code === 'Space' && !isTyping(e.target)) e.preventDefault();
  }, true);

  window.addEventListener('resize', () => { clampPos(); applyTransform(); });

  /* ---------- 底部搖桿滑桿：右加速、左減速、過中線倒退，放開回中 ---------- */
  let shuttleDragging = false;
  const THUMB_W = 46;

  function shuttleFraction(e){
    const r = shuttleTrack.getBoundingClientRect();
    const half = Math.max(1, (r.width - THUMB_W) / 2);
    const f = (e.clientX - (r.left + r.width/2)) / half;
    return Math.max(-1, Math.min(1, f));
  }
  function applyShuttle(f){
    const r = shuttleTrack.getBoundingClientRect();
    const half = (r.width - THUMB_W) / 2;
    shuttleThumb.style.left = (r.width/2 + f*half) + 'px';
    const dead = 0.04;
    if(Math.abs(f) < dead){
      shuttle = 0;
    } else {
      const a = (Math.abs(f) - dead) / (1 - dead);
      if(f > 0){
        // 往右：目前速度 × (1 ~ 21)
        shuttle = Math.pow(a, 1.5) * SHUTTLE_ACCEL;
      } else {
        // 往左：前半段從目前速度一路減到 0，後半段開始倒退
        const total = a <= 0.5 ? 1 - 2 * a : -Math.pow(2 * a - 1, 1.5) * SHUTTLE_REV;
        shuttle = total - 1;
      }
    }
    updateReadout();
    if(shuttle !== 0) ensureLoop();
  }
  shuttleTrack.addEventListener('pointerdown', (e) => {
    shuttleDragging = true;
    shuttleTrack.classList.add('dragging');
    shuttleTrack.setPointerCapture(e.pointerId);
    applyShuttle(shuttleFraction(e));
    e.preventDefault();
  });
  shuttleTrack.addEventListener('pointermove', (e) => {
    if(!shuttleDragging) return;
    applyShuttle(shuttleFraction(e));
  });
  function endShuttle(){
    if(!shuttleDragging) return;
    shuttleDragging = false;
    shuttleTrack.classList.remove('dragging');
    shuttle = 0;
    shuttleThumb.style.left = '50%';
    updateReadout();
  }
  shuttleTrack.addEventListener('pointerup', endShuttle);
  shuttleTrack.addEventListener('pointercancel', endShuttle);
  shuttleTrack.addEventListener('lostpointercapture', endShuttle);

  /* ---------- 可拖曳的閱讀箭頭 ---------- */
  let arrowTopPct = 50;
  let draggingArrow = false;
  function setArrowTop(pct){
    pct = Math.max(4, Math.min(96, pct));
    arrowTopPct = pct;
    centerArrow.style.top = pct + '%';
    try{ localStorage.setItem('teleprompter_arrow_top', String(pct)); }catch(e){}
  }
  function loadArrowTop(){
    let saved = null;
    try{ saved = localStorage.getItem('teleprompter_arrow_top'); }catch(e){}
    setArrowTop(saved !== null ? parseFloat(saved) : 50);
  }
  function pctFromClientY(clientY){
    const rect = stage.getBoundingClientRect();
    return ((clientY - rect.top) / rect.height) * 100;
  }
  centerArrow.addEventListener('pointerdown', (e) => {
    draggingArrow = true;
    centerArrow.classList.add('dragging');
    centerArrow.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  centerArrow.addEventListener('pointermove', (e) => {
    if(!draggingArrow) return;
    setArrowTop(pctFromClientY(e.clientY));
  });
  function endArrowDrag(){
    if(!draggingArrow) return;
    draggingArrow = false;
    centerArrow.classList.remove('dragging');
  }
  centerArrow.addEventListener('pointerup', endArrowDrag);
  centerArrow.addEventListener('pointercancel', endArrowDrag);

  /* ---------- 初始化 ---------- */
  try{
    const saved = localStorage.getItem(SCRIPT_KEY);
    if(saved) editor.innerHTML = saved;
  }catch(e){}
  refreshEditor();

  loadArrowTop();
  loadSettings();
  mirrorSwitch.classList.toggle('on', mirrored);
  setSpeed(speed);
  setFontSize(fontSize);
  setLineHeight(lineHeight);
  setSideMargin(sideMargin);
  setFontWeight(fontWeight);
  setArrowSize(arrowSize);
  setFont(fontKey);
  updateReadout();
})();
</script>
</body>
</html>
